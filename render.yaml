services:
  - type: web
    name: railbite-edge-server
    runtime: docker
    dockerfilePath: ./services/edge-server/Dockerfile
    dockerContext: .
    plan: standard
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/railbite.db
      - key: TRIP_ID
        value: TRIP_001
      - key: HMAC_SECRET
        generateValue: true
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
    disk:
      name: railbite-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /health

